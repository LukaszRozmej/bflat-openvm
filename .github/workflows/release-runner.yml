# Publishes the OpenVM execution harness as a container image.
#
# OpenVM ships no image at all - cargo-openvm is a source install - and the
# CLI's `run` takes a transpiled .vmexe, not an ELF. So anything that wants to
# RUN a bflat guest has to build the SDK from source, which is the long pole in
# any job that touches it. This publishes it once.
#
# runner/ is the harness of the rv64 line (branch develop-v2.1.0), runner32/
# that of the rv32 line (`main`): each line rejects the other's ELF outright.
# Each Dockerfile pins its revision to a commit so the image is reproducible.
#
# Published to Docker Hub, alongside the other images the guests use
# (nethermindeth/zisk, nethermindeth/bflat-riscv64). Logs in with OIDC: needs
# the DOCKERHUB_ORGANIZATION and DOCKERHUB_OIDC_CONNECTIONID variables in this
# repository or granted to it from the org, and a Docker Hub OIDC connection
# that trusts this repository's docker-hub environment, which a push runs in;
# the preflight step below says so plainly instead of letting the login step
# fail with a bare "Username required".
#
# Docker Hub pushes are manual only. After publishing, pin the new digest in
# the consumers (nethermind's Nethermind.Stateless.OpenVMGuest/Makefile and
# Nethermind.Stateless.OpenVM32Guest/Makefile, OPENVM_IMAGE).
#
# Every push to main also pushes ghcr.io/nethermindeth/openvm-runner:<sha> and
# :main, and <sha>-rv32 and :main-rv32 from runner32/, with the default
# OPENVM_REV of each Dockerfile, so CI jobs can pin the
# image of a commit by digest instead of building the SDK. Pull requests never
# run this workflow, so no fork code reaches a job that can push.
name: Release OpenVM runner

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      line:
        description: "OpenVM line: rv64 (runner/, develop-v2.1.0) or rv32 (runner32/, main)"
        type: choice
        default: rv64
        options:
          - rv64
          - rv32
      openvm_rev:
        description: OpenVM commit on that line to build the harness from (empty = the Dockerfile's)
        type: string
        default: ""
      image_tag:
        description: Image tag
        type: string
        default: v2.1.0-rv64
      push:
        description: Push to Docker Hub (off = build only, to check it compiles)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ghcr:
    name: openvm-runner ${{ matrix.line }} (ghcr)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NethermindEth/bflat-openvm'
    strategy:
      matrix:
        include:
          - line: rv64
            context: runner
            suffix: ""
          - line: rv32
            context: runner32
            suffix: -rv32
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/nethermindeth/openvm-runner:${{ github.sha }}${{ matrix.suffix }}
            ghcr.io/nethermindeth/openvm-runner:main${{ matrix.suffix }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ghcr${{ matrix.suffix }}
          cache-to: type=gha,scope=ghcr${{ matrix.suffix }},mode=max

      - name: Report the digest to pin
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          {
            echo "### Pin this in the consumers"
            echo '```'
            echo "ghcr.io/nethermindeth/openvm-runner:${GITHUB_SHA}${SUFFIX}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  runner:
    name: openvm-runner
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Pushes authenticate with Docker Hub OIDC, which trusts only this environment
    environment: ${{ inputs.push == true && 'docker-hub' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Check the Docker Hub OIDC variables are present
        if: inputs.push == true
        env:
          ORGANIZATION: ${{ vars.DOCKERHUB_ORGANIZATION }}
          CONNECTION_ID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        run: |
          [ -n "$ORGANIZATION" ] && [ -n "$CONNECTION_ID" ] || {
            echo "::error::DOCKERHUB_ORGANIZATION / DOCKERHUB_OIDC_CONNECTIONID are not set for this repository. Add them, or run with push off to build only."
            exit 1
          }

      - name: Log in to Docker Hub
        if: inputs.push == true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # The token must outlive the image build, as buildx only pushes at the end
          DOCKERHUB_OIDC_EXPIREIN: 3600
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.line == 'rv32' && 'runner32' || 'runner' }}
          build-args: ${{ inputs.openvm_rev != '' && format('OPENVM_REV={0}', inputs.openvm_rev) || '' }}
          push: ${{ inputs.push == true }}
          tags: nethermindeth/openvm-runner:${{ inputs.image_tag }}
          cache-from: type=gha,scope=${{ inputs.line }}
          cache-to: type=gha,scope=${{ inputs.line }},mode=max

      - name: Report the digest to pin
        if: inputs.push == true
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Pin this in the consumers"
            echo '```make'
            echo "OPENVM_IMAGE ?= nethermindeth/openvm-runner:${IMAGE_TAG}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
